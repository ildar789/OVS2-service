# Пример конфигурации Nginx как L7 реверс-прокси с балансировкой
# нагрузки и терминацией TLS. Файл — заготовка для лабораторной
# работы, в которой Nginx выносится перед этим приложением.

upstream lab3_backend {
    # round-robin по умолчанию; можно заменить на least_conn / ip_hash
    # least_conn;
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    # server app3:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name example.local;
    # редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.local;

    # TLS терминируется здесь, приложение о сертификатах не знает
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://lab3_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # health-check-ориентированный failover на другой узел
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /api/health {
        proxy_pass http://lab3_backend/api/health;
        access_log off;
    }
}
