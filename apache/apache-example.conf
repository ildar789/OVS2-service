# Пример конфигурации Apache HTTPD как реверс-прокси с балансировкой
# (mod_proxy_balancer) и терминацией TLS. Требуемые модули:
# proxy, proxy_http, proxy_balancer, lbmethod_byrequests, ssl, headers

<VirtualHost *:80>
    ServerName example.local
    Redirect permanent / https://example.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.local

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/fullchain.pem
    SSLCertificateKeyFile   /etc/apache2/ssl/privkey.pem

    <Proxy "balancer://lab3cluster">
        BalancerMember "http://app1:3000" retry=5
        BalancerMember "http://app2:3000" retry=5
        # BalancerMember "http://app3:3000" retry=5
        ProxySet lbmethod=byrequests
        # ProxySet lbmethod=byrequests hcheck=on hcmethod=GET hcuri=/api/health
    </Proxy>

    ProxyPreserveHost On
    ProxyPass        / balancer://lab3cluster/
    ProxyPassReverse / balancer://lab3cluster/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
